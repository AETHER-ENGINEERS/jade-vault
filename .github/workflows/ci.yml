name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: pip install -r jade-discord/requirements.txt
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build web app
        run: npm run build
      - name: Tests
        run: npm test
      - name: Rust for Android (libjade.so is rebuilt from rust/ every run)
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          # the runner's Android NDK: its clang wrappers link for API 26, as rust/README.md describes
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          [ -x "$BIN/aarch64-linux-android26-clang" ] || { echo "::error::No Android NDK found (looked in $NDK)."; exit 1; }
          {
            for t in aarch64-linux-android:aarch64-linux-android26 armv7-linux-androideabi:armv7a-linux-androideabi26 x86_64-linux-android:x86_64-linux-android26; do
              target=${t%%:*}; cc="$BIN/${t#*:}-clang"; under=$(echo "$target" | tr - _)
              echo "CARGO_TARGET_$(echo "$under" | tr a-z A-Z)_LINKER=$cc"
              echo "CC_$under=$cc"
              echo "AR_$under=$BIN/llvm-ar"
            done
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build APK (debug key)
        run: bash android/build-apk.sh
      - name: Is the committed Rust core up to date?
        run: |
          if git diff --quiet -- android/proj/lib; then echo "The committed libjade.so files match rust/."
          else echo "::notice::The libjade.so files in android/proj/lib differ from this fresh build of rust/ (this run's APK has the fresh ones). If rust/ changed, commit new ones with rust/build-android.sh."; fi
      - name: Bridge checks
        run: |
          python3 -m py_compile jade-vector/*.py jade-vector/test/*.py jade-discord/*.py jade-discord/test/*.py
          bash -n jade-vector/setup.sh
          bash -n jade-discord/setup.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jade-vault-build
          path: |
            dist/
            tests/.work/**/*.png
          if-no-files-found: ignore

  vector-agent:
    # Compiles Vector's vector-agent with the Jade patch, so a Vector change that breaks the patch shows up here.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: jade-vector
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
