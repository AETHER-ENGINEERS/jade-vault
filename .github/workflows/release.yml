name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (must exist)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Signed APK
        env:
          KS_B64: ${{ secrets.JADE_KEYSTORE_B64 }}
          JADE_KEYSTORE_PASSWORD: ${{ secrets.JADE_KEYSTORE_PASSWORD }}
          JADE_KEY_ALIAS: ${{ secrets.JADE_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Set the JADE_KEYSTORE_B64 / JADE_KEYSTORE_PASSWORD / JADE_KEY_ALIAS secrets to sign releases."; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          JADE_KEYSTORE="$RUNNER_TEMP/release.jks" bash android/build-apk.sh
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Bridge kit
        run: |
          mkdir -p dist/jade-vector && cp jade-vector/*.py jade-vector/*.sh jade-vector/Dockerfile jade-vector/docker-compose.yml jade-vector/.dockerignore jade-vector/README.md dist/jade-vector/
          tar -C dist -czf dist/jade-vector-$(cat VERSION).tar.gz jade-vector && rm -rf dist/jade-vector
          cd dist && sha256sum *.apk *.html *.xdc *.tar.gz > SHA256SUMS
      - name: Notes
        run: |
          V=$(cat VERSION); awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release create "$TAG" --title "Jade Vault $TAG" --notes-file notes.md dist/*.apk dist/jade-vault.html dist/jade-link.xdc dist/jade-vector-*.tar.gz dist/SHA256SUMS
